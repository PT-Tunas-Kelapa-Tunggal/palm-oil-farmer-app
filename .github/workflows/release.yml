name: App Store Connect release

on:
  push:
    tags: ['beta-v*', 'release-v*']

permissions:
  contents: read

jobs:
  route:
    name: Validate iOS release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.route.outputs.environment }}
      marketing_version: ${{ steps.route.outputs.marketing_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: route
        run: bash Scripts/ci-release-ref.sh

  release-schema:
    name: Verify release CloudKit schema
    needs: route
    uses: ./.github/workflows/cloudkit-schema.yml
    with:
      contract: PalmOilFarmer/CloudKitContract
      environment: ${{ needs.route.outputs.environment }}
      partition: production

  publish:
    name: Publish iOS build (${{ needs.route.outputs.environment }})
    needs: [route, release-schema]
    runs-on: xcode-27
    timeout-minutes: 90
    environment: ${{ needs.route.outputs.environment }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      IOS_ENVIRONMENT: ${{ needs.route.outputs.environment }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MARKETING_VERSION: ${{ needs.route.outputs.marketing_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive, export and verify iOS app
        id: archive
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          CLOUDKIT_CONTAINER_ID: ${{ needs.release-schema.outputs.container_id }}
          IOS_BUILD_NUMBER_OFFSET: ${{ vars.IOS_BUILD_NUMBER_OFFSET }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash Scripts/ci-archive-ios.sh
      - name: Install pinned Fastlane
        run: |
          version=2.241.2
          if ! gem list --installed fastlane --version "$version"; then
            gem install fastlane --version "$version" --no-document --user-install
            ruby -r rubygems -e 'puts File.join(Gem.user_dir, "bin")' >> "$GITHUB_PATH"
          fi
      - name: Publish the verified build
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          RELEASE_IPA: ${{ steps.archive.outputs.ipa }}
          RELEASE_BUNDLE_ID: ${{ steps.archive.outputs.bundle_id }}
          RELEASE_BUILD_NUMBER: ${{ steps.archive.outputs.build_number }}
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: fastlane _2.241.2_ publish_ci
      - name: Clean exported build
        if: always()
        env:
          RELEASE_IPA: ${{ steps.archive.outputs.ipa }}
        run: |
          if [[ -n "$RELEASE_IPA" ]]; then
            rm -f -- "$RELEASE_IPA"
          fi
